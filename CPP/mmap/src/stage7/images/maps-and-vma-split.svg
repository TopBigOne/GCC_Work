<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 730" width="960" height="730">
  <title>maps 字段与 VMA 拆分合并</title>
  <style>
    .t      { font-family: "PingFang SC", "Microsoft YaHei", "Noto Sans CJK SC", sans-serif; fill: #0f172a; }
    .mono   { font-family: Menlo, Consolas, "DejaVu Sans Mono", monospace; fill: #0f172a; }
    .sub    { font-family: "PingFang SC", "Microsoft YaHei", "Noto Sans CJK SC", sans-serif; font-size: 12px; fill: #475569; }
    .lbl    { font-family: "PingFang SC", "Microsoft YaHei", "Noto Sans CJK SC", sans-serif; font-size: 13px; font-weight: 600; fill: #0f172a; }
    .fn     { font-family: Menlo, Consolas, "DejaVu Sans Mono", monospace; font-size: 11px; fill: #64748b; }
    .band   { font-family: "PingFang SC", "Microsoft YaHei", "Noto Sans CJK SC", sans-serif; font-size: 14px; font-weight: 600; fill: #334155; }
    .main   { fill: #eff6ff; stroke: #2563eb; stroke-width: 1.5; }
    .key    { fill: #fff7ed; stroke: #ea580c; stroke-width: 1.5; }
    .brk    { stroke: #2563eb; stroke-width: 1.5; fill: none; }
    .lead   { stroke: #94a3b8; stroke-width: 1; fill: none; }
    .flow   { stroke: #2563eb; stroke-width: 2; fill: none; }
  </style>
  <defs>
    <marker id="ab" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/>
    </marker>
  </defs>

  <rect x="0.5" y="0.5" width="959" height="729" rx="12" fill="#ffffff" stroke="#e2e8f0"/>

  <text class="t" x="480" y="40" font-size="22" font-weight="700" text-anchor="middle">/proc/self/maps 的一行 = 一个 VMA</text>
  <text class="sub" x="480" y="64" text-anchor="middle" style="font-size:13px">每次 mmap 至少产生一个 VMA；mprotect 只改一部分权限会把它拆开，改回去后内核再合并</text>

  <!-- ===== ① 读懂 maps 的一行 ===== -->
  <rect x="16" y="84" width="928" height="262" rx="10" fill="#f8fafc" stroke="#e2e8f0"/>
  <text class="band" x="30" y="106">① 读懂 maps 的一行</text>

  <text class="mono" x="60" y="156" font-size="15">7f3a2d200000-7f3a2d3c5000</text>
  <text class="mono" x="306" y="156" font-size="15">r-xp</text>
  <text class="mono" x="362" y="156" font-size="15">00028000</text>
  <text class="mono" x="454" y="156" font-size="15">08:01</text>
  <text class="mono" x="519" y="156" font-size="15">1835</text>
  <text class="mono" x="590" y="156" font-size="15">/usr/lib/libc.so.6</text>

  <!-- 括号 -->
  <path class="brk" d="M60,166 L60,172 L286,172 L286,166"/>
  <path class="brk" d="M306,166 L306,172 L342,172 L342,166"/>
  <path class="brk" d="M362,166 L362,172 L434,172 L434,166"/>
  <path class="brk" d="M454,166 L454,172 L499,172 L499,166"/>
  <path class="brk" d="M519,166 L519,172 L555,172 L555,166"/>
  <path class="brk" d="M590,166 L590,172 L752,172 L752,166"/>

  <!-- 第一行标签：地址 / 偏移 / inode -->
  <line class="lead" x1="173" y1="172" x2="173" y2="190"/>
  <line class="lead" x1="398" y1="172" x2="398" y2="190"/>
  <line class="lead" x1="537" y1="172" x2="537" y2="190"/>
  <text class="lbl" x="173" y="206" text-anchor="middle">起止地址 [start, end)</text>
  <text class="fn" x="173" y="223" text-anchor="middle">vm_start / vm_end</text>
  <text class="lbl" x="398" y="206" text-anchor="middle">文件内偏移</text>
  <text class="fn" x="398" y="223" text-anchor="middle">vm_pgoff × 页大小</text>
  <text class="lbl" x="537" y="206" text-anchor="middle">inode</text>
  <text class="sub" x="537" y="223" text-anchor="middle">哪个文件</text>

  <!-- 第二行标签：权限 / 设备 / 路径 -->
  <line class="lead" x1="324" y1="172" x2="324" y2="244"/>
  <line class="lead" x1="476" y1="172" x2="476" y2="244"/>
  <line class="lead" x1="671" y1="172" x2="671" y2="244"/>
  <text class="lbl" x="324" y="260" text-anchor="middle">权限</text>
  <text class="sub" x="324" y="277" text-anchor="middle">r w x + p(私有) / s(共享)</text>
  <text class="lbl" x="476" y="260" text-anchor="middle">设备号</text>
  <text class="sub" x="476" y="277" text-anchor="middle">主:次</text>
  <text class="lbl" x="671" y="260" text-anchor="middle">路径</text>
  <text class="sub" x="671" y="277" text-anchor="middle">文件名，或 [heap] [stack] [vdso]</text>

  <text class="mono" x="60" y="312" font-size="13" fill="#64748b">7f3a2c000000-7f3a2c001000 rw-p 00000000 00:00 0</text>
  <text class="sub" x="510" y="312">← 匿名映射：偏移、设备、inode 都是 0，没有路径</text>
  <text class="fn" x="60" y="334">代码里对应 ProcessMapEntry：addr_start · addr_end · perms · offset · device · inode · pathname</text>

  <!-- ===== ② mprotect 拆分与合并 ===== -->
  <rect x="16" y="360" width="928" height="318" rx="10" fill="#f8fafc" stroke="#e2e8f0"/>
  <text class="band" x="30" y="382">② mprotect 拆分与合并 VMA（3 页的匿名映射）</text>

  <!-- 行 1：初始 -->
  <text class="lbl" x="36" y="428">初始</text>
  <rect class="main" x="80" y="402" width="330" height="44" rx="6"/>
  <line x1="190" y1="402" x2="190" y2="446" stroke="#93c5fd" stroke-dasharray="3 3"/>
  <line x1="300" y1="402" x2="300" y2="446" stroke="#93c5fd" stroke-dasharray="3 3"/>
  <text class="mono" x="245" y="429" font-size="13" text-anchor="middle">VMA #1  rw-p</text>
  <text class="fn" x="80" y="462" text-anchor="middle">A</text>
  <text class="fn" x="190" y="462" text-anchor="middle">A+1页</text>
  <text class="fn" x="300" y="462" text-anchor="middle">A+2页</text>
  <text class="fn" x="410" y="462" text-anchor="middle">A+3页</text>
  <text class="mono" x="450" y="418" font-size="12">mmap(NULL, 3 页, RW, MAP_PRIVATE | MAP_ANON)</text>
  <text class="sub" x="450" y="438">得到 1 个 VMA，maps 里是 1 行</text>

  <line class="flow" x1="245" y1="470" x2="245" y2="496" marker-end="url(#ab)"/>

  <!-- 行 2：拆分 -->
  <text class="lbl" x="36" y="528">拆分</text>
  <rect class="main" x="80" y="502" width="110" height="44" rx="6"/>
  <rect class="key" x="190" y="502" width="110" height="44" rx="0"/>
  <rect class="main" x="300" y="502" width="110" height="44" rx="6"/>
  <text class="mono" x="135" y="529" font-size="12" text-anchor="middle">#1 rw-p</text>
  <text class="mono" x="245" y="529" font-size="12" text-anchor="middle" fill="#c2410c">#2 r--p</text>
  <text class="mono" x="355" y="529" font-size="12" text-anchor="middle">#3 rw-p</text>
  <text class="mono" x="450" y="518" font-size="12">mprotect(A+1页, 1页, PROT_READ)</text>
  <text class="sub" x="450" y="538">中间那页权限不同了，内核把 VMA 拆成 3 个（split_vma），maps 里变成 3 行</text>

  <line class="flow" x1="245" y1="552" x2="245" y2="602" marker-end="url(#ab)"/>

  <!-- 行 3：合并 -->
  <text class="lbl" x="36" y="634">合并</text>
  <rect class="main" x="80" y="608" width="330" height="44" rx="6"/>
  <line x1="190" y1="608" x2="190" y2="652" stroke="#93c5fd" stroke-dasharray="3 3"/>
  <line x1="300" y1="608" x2="300" y2="652" stroke="#93c5fd" stroke-dasharray="3 3"/>
  <text class="mono" x="245" y="635" font-size="13" text-anchor="middle">VMA #1  rw-p</text>
  <text class="mono" x="450" y="624" font-size="12">mprotect(A+1页, 1页, PROT_READ | PROT_WRITE)</text>
  <text class="sub" x="450" y="644">相邻 VMA 属性又完全一样，内核把它们合并回 1 个（vma_merge）</text>

  <text class="sub" x="480" y="706" text-anchor="middle">Linux 上用 cat /proc/&lt;pid&gt;/maps 前后对比就能看到行数变化；macOS 没有 /proc，用 vmmap &lt;pid&gt; 观察</text>
</svg>
