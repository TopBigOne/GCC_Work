<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1282" width="1000" height="1282">
  <title>观察者模式时序</title>
  <style>
    .t     { font-family: "PingFang SC", "Microsoft YaHei", "Noto Sans CJK SC", sans-serif; fill: #0f172a; }
    .mono  { font-family: Menlo, Consolas, "DejaVu Sans Mono", monospace; font-size: 11.5px; fill: #0f172a; }
    .sub   { font-family: "PingFang SC", "Microsoft YaHei", "Noto Sans CJK SC", sans-serif; font-size: 12px; fill: #475569; }
    .msg   { font-family: "PingFang SC", "Microsoft YaHei", "Noto Sans CJK SC", sans-serif; font-size: 12px; fill: #1e293b; }
    .lbl   { font-family: "PingFang SC", "Microsoft YaHei", "Noto Sans CJK SC", sans-serif; font-size: 12px; fill: #1e293b; font-weight: 600; }
    .head  { font-family: "PingFang SC", "Microsoft YaHei", "Noto Sans CJK SC", sans-serif; font-size: 13px; font-weight: 700; fill: #0f172a; }
    .sec   { font-family: "PingFang SC", "Microsoft YaHei", "Noto Sans CJK SC", sans-serif; font-size: 13px; font-weight: 700; fill: #334155; }
    .panel { font-family: "PingFang SC", "Microsoft YaHei", "Noto Sans CJK SC", sans-serif; font-size: 16px; font-weight: 700; fill: #0f172a; }
    .msg, .mono, .sub, .lbl { paint-order: stroke; stroke: #ffffff; stroke-width: 4px; stroke-linejoin: round; }
    .life  { stroke: #94a3b8; stroke-width: 1.2; stroke-dasharray: 5 4; }
    .call  { stroke: #2563eb; stroke-width: 1.6; fill: none; }
    .ret   { stroke: #64748b; stroke-width: 1.3; fill: none; stroke-dasharray: 5 4; }
    .kern  { stroke: #ea580c; stroke-width: 1.6; fill: none; }
    .ok    { stroke: #16a34a; stroke-width: 1.6; fill: none; }
    .bad   { stroke: #dc2626; stroke-width: 1.8; fill: none; }
    .frame { fill: none; stroke: #475569; stroke-width: 1.2; }
    .tab   { fill: #f1f5f9; stroke: #475569; stroke-width: 1.2; }
    .p-app { fill: #eff6ff; stroke: #2563eb; stroke-width: 1.5; }
    .p-k   { fill: #fff7ed; stroke: #ea580c; stroke-width: 1.5; }
    .p-c   { fill: #ecfdf5; stroke: #16a34a; stroke-width: 1.5; }
    .p-g   { fill: #f8fafc; stroke: #64748b; stroke-width: 1.5; }
  </style>
  <defs>
    <marker id="mb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/></marker>
    <marker id="mg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#64748b"/></marker>
    <marker id="mo" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#ea580c"/></marker>
    <marker id="mgr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#16a34a"/></marker>
    <marker id="mr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/></marker>
  </defs>
  <rect x="0.5" y="0.5" width="999" height="1281" rx="12" fill="#ffffff" stroke="#e2e8f0"/>
  <text class="t" x="500.0" y="36" font-size="21" font-weight="700" text-anchor="middle">observer()：观察者模式记录一块匿名映射的一生</text>
  <text class="sub" x="500.0" y="60" text-anchor="middle" style="font-size:13px">每个系统调用都走&quot;MmapRegion 执行 → notify 通知&quot;两步；直接读写内存不经过包装类，没有事件</text>
  <line class="life" x1="100" y1="124" x2="100" y2="1150"/>
  <line class="life" x1="300" y1="124" x2="300" y2="1150"/>
  <line class="life" x1="490" y1="124" x2="490" y2="1150"/>
  <line class="life" x1="680" y1="124" x2="680" y2="1150"/>
  <line class="life" x1="880" y1="124" x2="880" y2="1150"/>
  <rect class="p-app" x="32" y="78" width="136" height="46" rx="8"/>
  <text class="head" x="100" y="98" text-anchor="middle">observer()</text>
  <text class="sub" x="100" y="116" text-anchor="middle">Stage7Kernel</text>
  <rect class="p-app" x="232" y="78" width="136" height="46" rx="8"/>
  <text class="head" x="300" y="98" text-anchor="middle">ObservableMmapRegion</text>
  <text class="sub" x="300" y="116" text-anchor="middle">region（被观察者）</text>
  <rect class="p-g" x="422" y="78" width="136" height="46" rx="8"/>
  <text class="head" x="490" y="98" text-anchor="middle">MmapRegion</text>
  <text class="sub" x="490" y="116" text-anchor="middle">region_（RAII 成员）</text>
  <rect class="p-k" x="612" y="78" width="136" height="46" rx="8"/>
  <text class="head" x="680" y="98" text-anchor="middle">内核</text>
  <text class="sub" x="680" y="116" text-anchor="middle">VMA / 页表</text>
  <rect class="p-c" x="812" y="78" width="136" height="46" rx="8"/>
  <text class="head" x="880" y="98" text-anchor="middle">ConsoleObserver</text>
  <text class="sub" x="880" y="116" text-anchor="middle">console_obs（观察者）</text>
  <line x1="20" y1="136" x2="980" y2="136" stroke="#cbd5e1" stroke-width="1"/>
  <text class="sec" x="24" y="153" text-anchor="start">① 注册观察者</text>
  <line class="call" x1="105" y1="172" x2="877" y2="172" marker-end="url(#mb)"/>
  <text class="msg" x="490.0" y="166" text-anchor="middle">构造 console_obs</text>
  <line class="call" x1="105" y1="198" x2="297" y2="198" marker-end="url(#mb)"/>
  <text class="mono" x="200.0" y="192" text-anchor="middle">add_observer(&amp;console_obs)</text>
  <text class="sub" x="200.0" y="213" text-anchor="middle">存进 observers_（只存裸指针）</text>
  <line x1="20" y1="232" x2="980" y2="232" stroke="#cbd5e1" stroke-width="1"/>
  <text class="sec" x="24" y="249" text-anchor="start">② map()：建立映射</text>
  <line class="call" x1="105" y1="268" x2="297" y2="268" marker-end="url(#mb)"/>
  <text class="mono" x="200.0" y="262" text-anchor="middle">map(4096, RW, PRIVATE|ANON)</text>
  <line class="call" x1="305" y1="292" x2="487" y2="292" marker-end="url(#mb)"/>
  <text class="msg" x="395.0" y="286" text-anchor="middle">构造 MmapRegion 临时对象</text>
  <line class="kern" x1="495" y1="316" x2="677" y2="316" marker-end="url(#mo)"/>
  <text class="mono" x="585.0" y="310" text-anchor="middle">mmap()</text>
  <path class="kern" d="M685,326 L712,326 L712,336 L687,336" marker-end="url(#mo)"/>
  <text class="msg" x="718" y="335" text-anchor="start">新建 VMA，不分配物理页</text>
  <line class="ret" x1="675" y1="358" x2="493" y2="358" marker-end="url(#mg)"/>
  <text class="msg" x="585.0" y="352" text-anchor="middle">返回映射地址</text>
  <path class="call" d="M305,368 L332,368 L332,378 L307,378" marker-end="url(#mb)"/>
  <text class="msg" x="338" y="377" text-anchor="start">region_ = 临时对象（移动赋值）</text>
  <path class="call" d="M305,396 L332,396 L332,406 L307,406" marker-end="url(#mb)"/>
  <text class="mono" x="338" y="405" text-anchor="start">notify(MAPPED, &quot;mmap created&quot;)</text>
  <line class="ok" x1="305" y1="428" x2="877" y2="428" marker-end="url(#mgr)"/>
  <text class="mono" x="590.0" y="422" text-anchor="middle">on_event(event)</text>
  <path class="ok" d="M875,438 L848,438 L848,448 L873,448" marker-end="url(#mgr)"/>
  <text class="mono" x="842" y="447" text-anchor="end">LOGI [EVENT] MAPPED</text>
  <line x1="20" y1="470" x2="980" y2="470" stroke="#cbd5e1" stroke-width="1"/>
  <text class="sec" x="24" y="487" text-anchor="start">③ 直接写内存：包装类完全不知道</text>
  <line class="kern" x1="105" y1="506" x2="677" y2="506" marker-end="url(#mo)"/>
  <text class="msg" x="200" y="500" text-anchor="start">memset(region.data(), 0xAB, 64)：第一次写这一页</text>
  <path class="kern" d="M675,516 L648,516 L648,526 L673,526" marker-end="url(#mo)"/>
  <text class="msg" x="642" y="525" text-anchor="end">缺页 → do_anonymous_page()</text>
  <text class="sub" x="642" y="541" text-anchor="end">分配一页清零的物理内存，填好 PTE</text>
  <line class="ret" x1="675" y1="562" x2="103" y2="562" marker-end="url(#mg)"/>
  <text class="msg" x="200" y="556" text-anchor="start">异常返回，重新执行写指令，写入成功</text>
  <text class="lbl" x="300" y="586" text-anchor="middle" fill="#dc2626">没有经过 ObservableMmapRegion → 不会产生任何事件</text>
  <line x1="20" y1="604" x2="980" y2="604" stroke="#cbd5e1" stroke-width="1"/>
  <text class="sec" x="24" y="621" text-anchor="start">④ protect(PROT_READ)：一个系统调用的完整套路</text>
  <line class="call" x1="105" y1="640" x2="297" y2="640" marker-end="url(#mb)"/>
  <text class="mono" x="200.0" y="634" text-anchor="middle">protect(PROT_READ)</text>
  <line class="call" x1="305" y1="664" x2="487" y2="664" marker-end="url(#mb)"/>
  <text class="mono" x="395.0" y="658" text-anchor="middle">region_.protect(prot)</text>
  <line class="kern" x1="495" y1="688" x2="677" y2="688" marker-end="url(#mo)"/>
  <text class="mono" x="585.0" y="682" text-anchor="middle">mprotect()</text>
  <path class="kern" d="M685,698 L712,698 L712,708 L687,708" marker-end="url(#mo)"/>
  <text class="msg" x="718" y="707" text-anchor="start">改 VMA 权限，已有 PTE 也改成只读</text>
  <line class="ret" x1="675" y1="730" x2="493" y2="730" marker-end="url(#mg)"/>
  <text class="mono" x="585.0" y="724" text-anchor="middle">rc = 0</text>
  <line class="ret" x1="485" y1="752" x2="303" y2="752" marker-end="url(#mg)"/>
  <text class="mono" x="395.0" y="746" text-anchor="middle">rc</text>
  <path class="call" d="M305,762 L332,762 L332,772 L307,772" marker-end="url(#mb)"/>
  <text class="msg" x="338" y="771" text-anchor="start">拼描述 &quot;mprotect prot=R (ok)&quot;，notify(PROTECTED)</text>
  <line class="ok" x1="305" y1="794" x2="877" y2="794" marker-end="url(#mgr)"/>
  <text class="mono" x="590.0" y="788" text-anchor="middle">on_event(event)</text>
  <path class="ok" d="M875,804 L848,804 L848,814 L873,814" marker-end="url(#mgr)"/>
  <text class="mono" x="842" y="813" text-anchor="end">LOGI [EVENT] PROTECTED</text>
  <rect class="frame" x="205" y="830" width="775" height="106"/>
  <path class="tab" d="M205,830 L259,830 L259,844 L251,852 L205,852 z"/>
  <text class="lbl" x="212" y="846" text-anchor="start">loop</text>
  <text class="lbl" x="267" y="846" text-anchor="start">同样的套路再走 3 次：调用 → 系统调用 → notify → 打印事件</text>
  <text class="mono" x="220" y="874" text-anchor="start">protect(PROT_READ|PROT_WRITE)</text>
  <text class="mono" x="470" y="874" text-anchor="start" fill="#c2410c">mprotect()</text>
  <text class="msg" x="590" y="874" text-anchor="start">PROTECTED  prot=RW (ok)</text>
  <text class="mono" x="220" y="896" text-anchor="start">sync(MS_SYNC)</text>
  <text class="mono" x="470" y="896" text-anchor="start" fill="#c2410c">msync()</text>
  <text class="msg" x="590" y="896" text-anchor="start">SYNCED  匿名映射没有文件可写回，直接成功</text>
  <text class="mono" x="220" y="918" text-anchor="start">lock()</text>
  <text class="mono" x="470" y="918" text-anchor="start" fill="#c2410c">mlock()</text>
  <text class="msg" x="590" y="918" text-anchor="start">LOCKED  把页锁在内存里，不会被换出</text>
  <line x1="20" y1="950" x2="980" y2="950" stroke="#cbd5e1" stroke-width="1"/>
  <text class="sec" x="24" y="967" text-anchor="start">⑤ unmap()：先通知，后解除</text>
  <line class="call" x1="105" y1="986" x2="297" y2="986" marker-end="url(#mb)"/>
  <text class="mono" x="200.0" y="980" text-anchor="middle">unmap()</text>
  <path class="call" d="M305,996 L332,996 L332,1006 L307,1006" marker-end="url(#mb)"/>
  <text class="msg" x="338" y="1005" text-anchor="start">notify(UNMAPPED)：这时地址和大小还有效</text>
  <line class="ok" x1="305" y1="1028" x2="877" y2="1028" marker-end="url(#mgr)"/>
  <text class="mono" x="590.0" y="1022" text-anchor="middle">on_event(event)</text>
  <path class="ok" d="M875,1038 L848,1038 L848,1048 L873,1048" marker-end="url(#mgr)"/>
  <text class="mono" x="842" y="1047" text-anchor="end">LOGI [EVENT] UNMAPPED</text>
  <line class="call" x1="305" y1="1070" x2="487" y2="1070" marker-end="url(#mb)"/>
  <text class="msg" x="395.0" y="1064" text-anchor="middle">region_ = MmapRegion()：operator= 里先 munmap 原来的映射</text>
  <line class="kern" x1="495" y1="1094" x2="677" y2="1094" marker-end="url(#mo)"/>
  <text class="mono" x="585.0" y="1088" text-anchor="middle">munmap()</text>
  <path class="kern" d="M675,1104 L648,1104 L648,1114 L673,1114" marker-end="url(#mo)"/>
  <text class="msg" x="642" y="1113" text-anchor="end">删除 VMA、清 PTE、释放物理页</text>
  <path class="call" d="M105,1124 L132,1124 L132,1134 L107,1134" marker-end="url(#mb)"/>
  <text class="msg" x="138" y="1133" text-anchor="start">函数返回：region、console_obs 析构（region_ 已空，不会重复 munmap）</text>
  <rect x="20" y="1170" width="470" height="92" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="1.2"/>
  <text class="lbl" x="36" y="1194" text-anchor="start" fill="#1d4ed8">为什么&quot;先通知、后解除&quot;</text>
  <text class="sub" x="36" y="1216" text-anchor="start">观察者拿到的 event 里有地址和大小；</text>
  <text class="sub" x="36" y="1236" text-anchor="start">如果先 munmap，region_ 已被清空，打印出来就是无效地址。</text>
  <rect x="510" y="1170" width="470" height="92" rx="10" fill="#fff7ed" stroke="#ea580c" stroke-width="1.2"/>
  <text class="lbl" x="526" y="1194" text-anchor="start" fill="#c2410c">包装类能看到什么、看不到什么</text>
  <text class="sub" x="526" y="1216" text-anchor="start">能看到：经过它的 mmap / mprotect / msync / mlock / munmap</text>
  <text class="sub" x="526" y="1236" text-anchor="start">看不到：缺页。那是 MMU 和内核之间的事，用户态代码无感知</text>
</svg>
