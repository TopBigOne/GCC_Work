<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 820" width="960" height="820">
  <title>Arena 分配器</title>
  <style>
    .t      { font-family: "PingFang SC", "Microsoft YaHei", "Noto Sans CJK SC", sans-serif; fill: #0f172a; }
    .mono   { font-family: Menlo, Consolas, "DejaVu Sans Mono", monospace; fill: #0f172a; font-size: 12px; }
    .sub    { font-family: "PingFang SC", "Microsoft YaHei", "Noto Sans CJK SC", sans-serif; font-size: 12px; fill: #475569; }
    .head   { font-family: "PingFang SC", "Microsoft YaHei", "Noto Sans CJK SC", sans-serif; font-size: 14px; font-weight: 600; fill: #334155; }
    .main   { fill: #eff6ff; stroke: #2563eb; stroke-width: 1.5; }
    .ctrl   { fill: #ecfdf5; stroke: #059669; stroke-width: 1.5; }
    .persist{ fill: #fff7ed; stroke: #ea580c; stroke-width: 1.5; }
    .empty  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.2; stroke-dasharray: 5 4; }
    .pad    { fill: #fee2e2; stroke: #dc2626; stroke-width: 1.2; }
    .pill   { fill: #1e3a8a; }
    .flow   { stroke: #2563eb; stroke-width: 1.8; fill: none; }
    .gray   { stroke: #64748b; stroke-width: 1.5; fill: none; }
  </style>
  <defs>
    <marker id="ab" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/>
    </marker>
    <marker id="ax" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#64748b"/>
    </marker>
  </defs>

  <rect x="0.5" y="0.5" width="959" height="819" rx="12" fill="#ffffff" stroke="#e2e8f0"/>

  <text class="t" x="480" y="40" font-size="22" font-weight="700" text-anchor="middle">从 malloc 到 Arena：用匿名映射自己管内存</text>
  <text class="sub" x="480" y="64" text-anchor="middle" style="font-size:13px">Arena = 一次 mmap 拿整块 + 指针往前推（bump）+ 整体回收</text>

  <!-- ===== 左：malloc ===== -->
  <rect x="40" y="88" width="430" height="200" rx="10" fill="#f8fafc" stroke="#cbd5e1"/>
  <text class="head" x="56" y="114">malloc / free（通用分配器）</text>

  <rect class="main" x="60" y="132" width="140" height="44" rx="6"/>
  <text class="mono" x="130" y="159" text-anchor="middle">malloc(64)</text>
  <line class="flow" x1="200" y1="154" x2="226" y2="154" marker-end="url(#ab)"/>
  <rect class="main" x="230" y="128" width="222" height="52" rx="6"/>
  <text class="t" x="341" y="150" text-anchor="middle" style="font-size:13px">brk 堆里切一小块</text>
  <text class="sub" x="341" y="169" text-anchor="middle">有块头、空闲链表，free 放回链表</text>

  <rect class="persist" x="60" y="200" width="140" height="44" rx="6"/>
  <text class="mono" x="130" y="227" text-anchor="middle">malloc(1MB)</text>
  <line class="flow" x1="200" y1="222" x2="226" y2="222" marker-end="url(#ab)"/>
  <rect class="persist" x="230" y="196" width="222" height="52" rx="6"/>
  <text class="t" x="341" y="218" text-anchor="middle" style="font-size:13px">≥128KB：直接 mmap 匿名映射</text>
  <text class="sub" x="341" y="237" text-anchor="middle">free 时 munmap 还给内核</text>

  <text class="sub" x="56" y="274">glibc 默认阈值 M_MMAP_THRESHOLD；macOS 大块同样直接向内核要页</text>

  <!-- ===== 右：Arena ===== -->
  <rect x="490" y="88" width="430" height="200" rx="10" fill="#f8fafc" stroke="#cbd5e1"/>
  <text class="head" x="506" y="114">ArenaAllocator（本 stage）</text>

  <rect class="pill" x="506" y="132" width="60" height="24" rx="12"/>
  <text class="t" x="536" y="149" text-anchor="middle" style="font-size:12px; fill:#ffffff">构造</text>
  <text class="t" x="578" y="149" style="font-size:12.5px">一次 mmap(PRIVATE|ANON) 拿下整块</text>

  <rect class="pill" x="506" y="168" width="60" height="24" rx="12"/>
  <text class="t" x="536" y="185" text-anchor="middle" style="font-size:12px; fill:#ffffff">alloc</text>
  <text class="t" x="578" y="185" style="font-size:12.5px">offset_ 对齐后往前推 —— 只是一次加法</text>

  <rect class="pill" x="506" y="204" width="60" height="24" rx="12"/>
  <text class="t" x="536" y="221" text-anchor="middle" style="font-size:12px; fill:#ffffff">reset</text>
  <text class="t" x="578" y="221" style="font-size:12.5px">offset_ = 0，整块复用，不用逐个 free</text>

  <rect class="pill" x="506" y="240" width="60" height="24" rx="12"/>
  <text class="t" x="536" y="257" text-anchor="middle" style="font-size:12px; fill:#ffffff">析构</text>
  <text class="t" x="578" y="257" style="font-size:12.5px">munmap 一次性把整块还给内核</text>

  <!-- ===== 真实布局 ===== -->
  <text class="head" x="40" y="330">demo_arena_allocator 的真实布局（capacity = 4096，偏移按运行输出换算）</text>

  <text class="sub" x="80" y="368">int a, b（各 4B）</text>
  <rect class="main" x="80" y="380" width="20" height="50"/>
  <rect class="main" x="100" y="380" width="20" height="50" style="fill:#dbeafe"/>
  <rect class="ctrl" x="120" y="380" width="120" height="50"/>
  <text class="t" x="180" y="402" text-anchor="middle" style="font-size:12.5px">p1  Point</text>
  <text class="sub" x="180" y="420" text-anchor="middle">24B</text>
  <rect class="ctrl" x="240" y="380" width="120" height="50" style="fill:#d1fae5"/>
  <text class="t" x="300" y="402" text-anchor="middle" style="font-size:12.5px">p2  Point</text>
  <text class="sub" x="300" y="420" text-anchor="middle">24B</text>
  <rect class="persist" x="360" y="380" width="400" height="50"/>
  <text class="t" x="560" y="402" text-anchor="middle" style="font-size:12.5px">arr  double[10]</text>
  <text class="sub" x="560" y="420" text-anchor="middle">80B（alloc 原始内存）</text>
  <rect class="empty" x="760" y="380" width="140" height="50"/>
  <text class="sub" x="830" y="402" text-anchor="middle">剩余 3960B</text>
  <text class="sub" x="830" y="420" text-anchor="middle">（未触碰，不占 RSS）</text>

  <!-- 刻度 -->
  <g class="sub" text-anchor="middle" style="font-size:11px">
    <line x1="80" y1="430" x2="80" y2="438" stroke="#64748b"/><text x="80" y="452">0</text>
    <line x1="100" y1="430" x2="100" y2="438" stroke="#64748b"/><text x="100" y="452">4</text>
    <line x1="120" y1="430" x2="120" y2="438" stroke="#64748b"/><text x="120" y="452">8</text>
    <line x1="240" y1="430" x2="240" y2="438" stroke="#64748b"/><text x="240" y="452">32</text>
    <line x1="360" y1="430" x2="360" y2="438" stroke="#64748b"/><text x="360" y="452">56</text>
  </g>
  <text class="sub" x="386" y="452" style="font-size:11px">（偏移，单位：字节）</text>

  <!-- offset_ 指针 -->
  <line class="flow" x1="760" y1="492" x2="760" y2="436" marker-end="url(#ab)"/>
  <text class="mono" x="770" y="476" style="fill:#2563eb">offset_ = 136</text>
  <text class="sub" x="770" y="494">= used()</text>

  <!-- reset 回到 0 -->
  <path class="gray" d="M 700 432 C 650 560, 50 560, 68 440" stroke-dasharray="6 4" marker-end="url(#ax)"/>
  <text class="sub" x="400" y="556" text-anchor="middle">reset()：offset_ = 0 → 下一次 create&lt;int&gt;(777) 又从 +0 开始，c 与 a 的地址相同</text>

  <text class="mono" x="40" y="594" style="font-size:11.5px; fill:#475569">运行输出：a=…c000(+0)  b=…c004(+4)  p1=…c008(+8)  p2=…c020(+32)  arr 从 +56 起  used=136</text>

  <!-- ===== 对齐 ===== -->
  <rect x="40" y="624" width="880" height="130" rx="10" fill="#f8fafc" stroke="#cbd5e1"/>
  <text class="head" x="60" y="652">对齐：<tspan class="mono" style="font-size:13px">alignUp(v, a) = (v + a − 1) &amp; ~(a − 1)</tspan></text>
  <text class="sub" x="60" y="678">a 必须是 2 的幂。b 结束于 +8，正好是 8 的倍数，所以 p1 前没有填充。</text>
  <text class="sub" x="60" y="700">假设 offset_ = 5 时 create&lt;Point&gt;（alignof(Point) = 8）：</text>
  <text class="sub" x="60" y="722">alignUp(5, 8) = 8 → 跳过 3 字节填充，Point 从 +8 开始</text>
  <text class="sub" x="60" y="742">不对齐会怎样：某些 CPU 直接报错，x86/ARM64 上也会变慢</text>

  <text class="sub" x="665" y="672" text-anchor="middle">已用 5B</text>
  <text class="sub" x="769" y="672" text-anchor="middle" style="fill:#dc2626">填充</text>
  <text class="sub" x="834" y="672" text-anchor="middle">Point →</text>
  <g>
    <rect class="main" x="600" y="680" width="26" height="30"/>
    <rect class="main" x="626" y="680" width="26" height="30"/>
    <rect class="main" x="652" y="680" width="26" height="30"/>
    <rect class="main" x="678" y="680" width="26" height="30"/>
    <rect class="main" x="704" y="680" width="26" height="30"/>
    <rect class="pad" x="730" y="680" width="26" height="30"/>
    <rect class="pad" x="756" y="680" width="26" height="30"/>
    <rect class="pad" x="782" y="680" width="26" height="30"/>
    <rect class="ctrl" x="808" y="680" width="26" height="30"/>
    <rect class="ctrl" x="834" y="680" width="26" height="30"/>
  </g>
  <g class="sub" text-anchor="middle" style="font-size:11px">
    <text x="600" y="726">0</text>
    <text x="730" y="726">5</text>
    <text x="808" y="726">8</text>
  </g>

  <!-- 图例 -->
  <g transform="translate(40, 790)">
    <rect class="main" x="0" y="-12" width="16" height="16" rx="3"/>
    <text class="sub" x="24" y="1">int</text>
    <rect class="ctrl" x="70" y="-12" width="16" height="16" rx="3"/>
    <text class="sub" x="94" y="1">Point</text>
    <rect class="persist" x="150" y="-12" width="16" height="16" rx="3"/>
    <text class="sub" x="174" y="1">原始数组 / 大块分配</text>
    <rect class="pad" x="310" y="-12" width="16" height="16" rx="3"/>
    <text class="sub" x="334" y="1">对齐填充（浪费）</text>
    <rect class="empty" x="460" y="-12" width="16" height="16" rx="3"/>
    <text class="sub" x="484" y="1">未使用</text>
  </g>
</svg>
