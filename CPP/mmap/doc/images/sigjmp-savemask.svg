<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 510" width="960" height="510">
  <title>savemask 参数对信号掩码的影响</title>
  <style>
    .t     { font-family: "PingFang SC", "Microsoft YaHei", "Noto Sans CJK SC", sans-serif; fill: #0f172a; }
    .mono  { font-family: Menlo, Consolas, "DejaVu Sans Mono", monospace; font-size: 12px; fill: #0f172a; font-weight: 600; }
    .sub   { font-family: "PingFang SC", "Microsoft YaHei", "Noto Sans CJK SC", sans-serif; font-size: 12px; fill: #475569; }
    .row   { font-family: "PingFang SC", "Microsoft YaHei", "Noto Sans CJK SC", sans-serif; font-size: 14px; font-weight: 600; fill: #0f172a; }
    .main  { fill: #eff6ff; stroke: #2563eb; stroke-width: 1.5; }
    .sig   { fill: #fff7ed; stroke: #ea580c; stroke-width: 1.5; }
    .ok    { fill: #ecfdf5; stroke: #059669; stroke-width: 2; }
    .bad   { fill: #fef2f2; stroke: #dc2626; stroke-width: 2; }
    .flow  { stroke: #2563eb; stroke-width: 2; fill: none; }
    .m-free    { fill: #f1f5f9; stroke: #94a3b8; }
    .m-handler { fill: #fff7ed; stroke: #ea580c; }
    .m-stuck   { fill: #fef2f2; stroke: #dc2626; }
    .mt        { font-family: Menlo, Consolas, monospace; font-size: 11px; }
  </style>
  <defs>
    <marker id="ab" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/>
    </marker>
  </defs>

  <rect x="0.5" y="0.5" width="959" height="509" rx="12" fill="#ffffff" stroke="#e2e8f0"/>

  <text class="t" x="480" y="38" font-size="20" font-weight="700" text-anchor="middle">savemask 决定 siglongjmp 之后信号还能不能再次投递</text>
  <text class="sub" x="480" y="62" text-anchor="middle" style="font-size:13px">同一段代码连续两次写只读页；每个步骤下方的小框是此刻进程的信号掩码（被阻塞的信号）</text>

  <!-- ===== 第 1 行：savemask = 1 ===== -->
  <text class="row" x="30" y="100">sigsetjmp(buf, 1)：保存并在跳回时恢复信号掩码</text>

  <rect class="main" x="30"  y="112" width="164" height="78" rx="8"/>
  <text class="mono" x="112" y="134" text-anchor="middle">sigsetjmp(buf, 1)</text>
  <text class="sub"  x="112" y="154" text-anchor="middle">保存现场 + 信号掩码</text>
  <text class="sub"  x="112" y="172" text-anchor="middle">第一次返回 0</text>

  <rect class="main" x="216" y="112" width="164" height="78" rx="8"/>
  <text class="mono" x="298" y="134" text-anchor="middle">*p = 'X'</text>
  <text class="sub"  x="298" y="154" text-anchor="middle">写只读页</text>
  <text class="sub"  x="298" y="172" text-anchor="middle">MMU 拦截 → 缺页异常</text>

  <rect class="sig"  x="402" y="112" width="164" height="78" rx="8"/>
  <text class="mono" x="484" y="134" text-anchor="middle">on_fault(SIGBUS)</text>
  <text class="sub"  x="484" y="154" text-anchor="middle">内核投递信号</text>
  <text class="sub"  x="484" y="172" text-anchor="middle">并自动阻塞 SIGBUS</text>

  <rect class="main" x="588" y="112" width="164" height="78" rx="8"/>
  <text class="mono" x="670" y="134" text-anchor="middle">siglongjmp(buf, 1)</text>
  <text class="sub"  x="670" y="154" text-anchor="middle">跳回 sigsetjmp，返回 1</text>
  <text class="sub"  x="670" y="172" text-anchor="middle">恢复保存的掩码</text>

  <rect class="ok"   x="774" y="112" width="164" height="78" rx="8"/>
  <text class="mono" x="856" y="134" text-anchor="middle">第 2 次 *p = 'X'</text>
  <text class="sub"  x="856" y="154" text-anchor="middle">SIGBUS 未被阻塞</text>
  <text class="sub"  x="856" y="172" text-anchor="middle" style="fill:#059669;font-weight:600">✓ 再次被拦截</text>

  <line class="flow" x1="194" y1="151" x2="212" y2="151" marker-end="url(#ab)"/>
  <line class="flow" x1="380" y1="151" x2="398" y2="151" marker-end="url(#ab)"/>
  <line class="flow" x1="566" y1="151" x2="584" y2="151" marker-end="url(#ab)"/>
  <line class="flow" x1="752" y1="151" x2="770" y2="151" marker-end="url(#ab)"/>

  <rect class="m-free"    x="57"  y="200" width="110" height="22" rx="11"/>
  <text class="mt" x="112" y="215" text-anchor="middle" fill="#475569">掩码 { }</text>
  <rect class="m-free"    x="243" y="200" width="110" height="22" rx="11"/>
  <text class="mt" x="298" y="215" text-anchor="middle" fill="#475569">掩码 { }</text>
  <rect class="m-handler" x="424" y="200" width="120" height="22" rx="11"/>
  <text class="mt" x="484" y="215" text-anchor="middle" fill="#ea580c">掩码 {SIGBUS}</text>
  <rect class="m-free"    x="615" y="200" width="110" height="22" rx="11"/>
  <text class="mt" x="670" y="215" text-anchor="middle" fill="#475569">掩码 { }</text>
  <rect class="m-free"    x="801" y="200" width="110" height="22" rx="11"/>
  <text class="mt" x="856" y="215" text-anchor="middle" fill="#475569">掩码 { }</text>

  <!-- 分隔线 -->
  <line x1="30" y1="248" x2="938" y2="248" stroke="#e2e8f0" stroke-width="1.5"/>

  <!-- ===== 第 2 行：savemask = 0 ===== -->
  <text class="row" x="30" y="282">sigsetjmp(buf, 0)：不保存掩码，跳回后掩码保持 handler 里的样子</text>

  <rect class="main" x="30"  y="294" width="164" height="78" rx="8"/>
  <text class="mono" x="112" y="316" text-anchor="middle">sigsetjmp(buf, 0)</text>
  <text class="sub"  x="112" y="336" text-anchor="middle">只保存现场</text>
  <text class="sub"  x="112" y="354" text-anchor="middle">不保存信号掩码</text>

  <rect class="main" x="216" y="294" width="164" height="78" rx="8"/>
  <text class="mono" x="298" y="316" text-anchor="middle">*p = 'X'</text>
  <text class="sub"  x="298" y="336" text-anchor="middle">写只读页</text>
  <text class="sub"  x="298" y="354" text-anchor="middle">MMU 拦截 → 缺页异常</text>

  <rect class="sig"  x="402" y="294" width="164" height="78" rx="8"/>
  <text class="mono" x="484" y="316" text-anchor="middle">on_fault(SIGBUS)</text>
  <text class="sub"  x="484" y="336" text-anchor="middle">内核投递信号</text>
  <text class="sub"  x="484" y="354" text-anchor="middle">并自动阻塞 SIGBUS</text>

  <rect class="main" x="588" y="294" width="164" height="78" rx="8"/>
  <text class="mono" x="670" y="316" text-anchor="middle">siglongjmp(buf, 1)</text>
  <text class="sub"  x="670" y="336" text-anchor="middle">跳回 sigsetjmp，返回 1</text>
  <text class="sub"  x="670" y="354" text-anchor="middle">掩码没有被恢复</text>

  <rect class="bad"  x="774" y="294" width="164" height="78" rx="8"/>
  <text class="mono" x="856" y="316" text-anchor="middle">第 2 次 *p = 'X'</text>
  <text class="sub"  x="856" y="336" text-anchor="middle">SIGBUS 仍被阻塞</text>
  <text class="sub"  x="856" y="354" text-anchor="middle" style="fill:#dc2626;font-weight:600;font-size:11.5px">✗ macOS 卡死 / Linux 被杀</text>

  <line class="flow" x1="194" y1="333" x2="212" y2="333" marker-end="url(#ab)"/>
  <line class="flow" x1="380" y1="333" x2="398" y2="333" marker-end="url(#ab)"/>
  <line class="flow" x1="566" y1="333" x2="584" y2="333" marker-end="url(#ab)"/>
  <line class="flow" x1="752" y1="333" x2="770" y2="333" marker-end="url(#ab)"/>

  <rect class="m-free"    x="57"  y="382" width="110" height="22" rx="11"/>
  <text class="mt" x="112" y="397" text-anchor="middle" fill="#475569">掩码 { }</text>
  <rect class="m-free"    x="243" y="382" width="110" height="22" rx="11"/>
  <text class="mt" x="298" y="397" text-anchor="middle" fill="#475569">掩码 { }</text>
  <rect class="m-handler" x="424" y="382" width="120" height="22" rx="11"/>
  <text class="mt" x="484" y="397" text-anchor="middle" fill="#ea580c">掩码 {SIGBUS}</text>
  <rect class="m-stuck"   x="610" y="382" width="120" height="22" rx="11"/>
  <text class="mt" x="670" y="397" text-anchor="middle" fill="#dc2626">掩码 {SIGBUS}</text>
  <rect class="m-stuck"   x="796" y="382" width="120" height="22" rx="11"/>
  <text class="mt" x="856" y="397" text-anchor="middle" fill="#dc2626">掩码 {SIGBUS}</text>

  <!-- 底部说明 -->
  <rect x="30" y="428" width="908" height="62" rx="8" fill="#f8fafc" stroke="#e2e8f0"/>
  <text class="sub" x="46" y="452" style="font-size:12.5px">handler 运行期间，内核会自动把正在处理的信号加入掩码（除非 sigaction 设置了 SA_NODEFER），防止同一信号重入。</text>
  <text class="sub" x="46" y="474" style="font-size:12.5px">正常 return 时内核会撤销这次阻塞；siglongjmp 绕过了 return，只有 savemask≠0 才会把 sigsetjmp 时保存的掩码还原回来。</text>
</svg>
